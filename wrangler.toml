name = "moots"
main = "web/worker/index.js"
compatibility_date = "2025-06-01"

# Static site (the app) — served directly from the edge; the Worker handles the
# API routes (/pfp, /banner, /share, /v/:id) and anything that isn't a file.
[assets]
directory = "web/public"
binding = "ASSETS"

# KV stores shared/published constellations (aggregated tally + preview image).
# Create it once with:  npx wrangler kv namespace create SHARES
# then paste the printed id below. (The "Deploy to Cloudflare" button provisions
# this automatically.)
[[kv_namespaces]]
binding = "SHARES"
id = "ec8ce1f8f5084095a73fda0e0bbc4fa5"
